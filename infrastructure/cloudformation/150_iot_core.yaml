Resources:

  CertificateSigningRequestSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: healt-monitor-iot-certificate-signing-request
      Description: IoT device certificate
      SecretString: !Ref CertificateSigningRequest

  IoTThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: IotSimulatorDevice

  IoTPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: IotSimulatorPolicy
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - iot:Connect
              - iot:Publish
              - iot:Subscribe
              - iot:Receive
            Resource: "*"

  IoTCertificate:
    Type: AWS::IoT::Certificate
    Properties:
      Status: ACTIVE
      CertificateMode: DEFAULT
      CertificateSigningRequest: !Ref CertificateSigningRequest

  ThingPrincipalAttachment:
    Type: AWS::IoT::ThingPrincipalAttachment
    Properties:
      ThingName: !Ref IoTThing
      Principal: !GetAtt IoTCertificate.Arn

  PolicyPrincipalAttachment:
    Type: AWS::IoT::PolicyPrincipalAttachment
    Properties:
      PolicyName: !Ref IoTPolicy
      Principal: !GetAtt IoTCertificate.Arn



  IotPrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: healt-monitor-iot-private-key

  IotCertificateSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: healt-monitor-iot-certificate

  IotRootCASecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: healt-monitor-iot-root-ca

  IotLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IotSecretsWriteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iot:CreateKeysAndCertificate
                  - iot:DescribeEndpoint
                  - secretsmanager:PutSecretValue
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  IotCertLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: IotCertGenerator
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt IotLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json

          def handler(event, context):
              iot = boto3.client('iot')
              secrets = boto3.client('secretsmanager')

              try:
                  if event['RequestType'] == 'Create':
                      cert = iot.create_keys_and_certificate(setAsActive=True)
                      certPem = cert['certificatePem']
                      keyPem = cert['keyPair']['PrivateKey']
                      caPem = boto3.client('iot').describe_endpoint(endpointType='iot:Data-ATS')['endpointAddress']

                      secrets.put_secret_value(
                          SecretId=event['ResourceProperties']['PrivateKeySecretId'],
                          SecretString=keyPem
                      )
                      secrets.put_secret_value(
                          SecretId=event['ResourceProperties']['CertificateSecretId'],
                          SecretString=certPem
                      )
                      # For demonstration purposes; normally use real CA contents
                      secrets.put_secret_value(
                          SecretId=event['ResourceProperties']['RootCASecretId'],
                          SecretString="USE_REAL_CA_HERE_OR_DOWNLOAD"
                      )

                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, cert['certificateId'])

                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, 'noop')

              except Exception as e:
                  print("Exception:", str(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Message": str(e)}, 'Error')

  IotCustomResource:
    Type: Custom::IotCertificateGenerator
    Properties:
      ServiceToken: !GetAtt IotCertLambda.Arn
      PrivateKeySecretId: !Ref IotPrivateKeySecret
      CertificateSecretId: !Ref IotCertificateSecret
      RootCASecretId: !Ref IotRootCASecret





# Outputs:
#   CertificateId:
#     Description: Certificate ID
#     Value: !Ref IoTCertificate

#   CertificatePem:
#     Description: Certificate in PEM format
#     Value: !GetAtt IoTCertificate.CertificatePem

#   PrivateKey:
#     Description: Private key for the certificate
#     Value: !GetAtt IoTCertificate.PrivateKey

#   IotEndpoint:
#     Description: AWS IoT Data ATS endpoint
#     Value: !Sub "{{resolve:ssm:/aws/service/iot/data-ats}}"
